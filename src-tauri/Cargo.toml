[package]
name = "deepseek-desktop"
version = "0.1.0"
description = "Unofficial DeepSeek Harness desktop launcher"
authors = ["DeepSeek-Desktop contributors"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "deepseek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
